<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>管理ページ | RyuSe1 STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%239ed7ff'/%3E%3Cstop offset='.55' stop-color='%23bdb4ff'/%3E%3Cstop offset='1' stop-color='%23f4c6ec'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='12' fill='url(%23g)'/%3E%3Cpath d='M26 7c.6 3.9 2.9 6.2 6.8 6.8-3.9.6-6.2 2.9-6.8 6.8-.6-3.9-2.9-6.2-6.8-6.8 3.9-.6 6.2-2.9 6.8-6.8z' fill='%23fff'/%3E%3Cpath d='M8 32 19 21M7 25l7-7M14 33l7-7' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' opacity='.85'/%3E%3C/svg%3E">
<style>
/* RyuSe1 STUDIO — layout: editorial journal / colors & type: icy blue × lavender */
:root{
  --bg:#f3f5fb;--surface:rgba(255,255,255,.76);--surface-solid:#ffffff;--surface-2:rgba(236,240,252,.95);
  --text:#252b47;--text-2:#4a5272;--muted:#8990ad;--line:rgba(135,150,205,.22);--line-strong:rgba(135,150,205,.4);
  --accent:#7482ea;--accent-2:#9a86ee;--accent-soft:rgba(116,130,234,.11);
  --holo:linear-gradient(118deg,#9ed7ff 0%,#bdb4ff 40%,#f2c3ea 70%,#b6ecdf 100%);
  --holo-soft:linear-gradient(118deg,rgba(158,215,255,.28),rgba(189,180,255,.28) 45%,rgba(242,195,234,.24) 75%,rgba(182,236,223,.22));
  --shadow:0 1px 2px rgba(40,50,100,.04),0 10px 30px rgba(70,82,150,.07);
  --shadow-hover:0 2px 4px rgba(40,50,100,.05),0 18px 40px rgba(70,82,150,.14);
  --shadow-lg:0 30px 80px rgba(30,36,80,.28);
  --glow-1:rgba(158,215,255,.42);--glow-2:rgba(189,180,255,.34);--glow-3:rgba(244,198,236,.22);
  --r-xl:26px;--r-lg:20px;--r-md:14px;--r-sm:10px;
  --ff-ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --ff-en:"Outfit",var(--ff-ja);color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1022;--surface:rgba(25,30,58,.72);--surface-solid:#181d38;--surface-2:rgba(33,39,72,.85);
  --text:#e9ecfb;--text-2:#c3c9e8;--muted:#8e96bd;--line:rgba(150,165,235,.14);--line-strong:rgba(150,165,235,.28);
  --accent:#9ba7ff;--accent-2:#b8a6ff;--accent-soft:rgba(155,167,255,.14);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.28);--shadow-hover:0 2px 4px rgba(0,0,0,.3),0 20px 44px rgba(0,0,0,.4);
  --glow-1:rgba(80,140,220,.20);--glow-2:rgba(130,110,230,.20);--glow-3:rgba(210,120,190,.10);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1022;--surface:rgba(25,30,58,.72);--surface-solid:#181d38;--surface-2:rgba(33,39,72,.85);
  --text:#e9ecfb;--text-2:#c3c9e8;--muted:#8e96bd;--line:rgba(150,165,235,.14);--line-strong:rgba(150,165,235,.28);
  --accent:#9ba7ff;--accent-2:#b8a6ff;--accent-soft:rgba(155,167,255,.14);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.28);--shadow-hover:0 2px 4px rgba(0,0,0,.3),0 20px 44px rgba(0,0,0,.4);
  --glow-1:rgba(80,140,220,.20);--glow-2:rgba(130,110,230,.20);--glow-3:rgba(210,120,190,.10);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:110px}
body{margin:0;min-height:100vh;color:var(--text);font:14px/1.8 var(--ff-ja);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:var(--bg);
  background-image:radial-gradient(900px 520px at 6% -8%,var(--glow-1),transparent 62%),radial-gradient(820px 620px at 104% 6%,var(--glow-2),transparent 60%),radial-gradient(760px 520px at 50% 112%,var(--glow-3),transparent 62%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff,transparent 60%),radial-gradient(1.2px 1.2px at 32% 72%,#fff,transparent 60%),radial-gradient(1.6px 1.6px at 58% 12%,#fff,transparent 60%),radial-gradient(1.2px 1.2px at 78% 44%,#fff,transparent 60%),radial-gradient(1.4px 1.4px at 90% 82%,#fff,transparent 60%),radial-gradient(1px 1px at 46% 90%,#fff,transparent 60%)}
#app{position:relative;z-index:1}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}h1,h2,h3,h4,p{margin:0}h1,h2,h3,h4{line-height:1.4}ul{margin:0;padding:0;list-style:none}
button,a,input,textarea{touch-action:manipulation}button,a{ -webkit-tap-highlight-color:transparent }
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
::selection{background:var(--accent-2);color:#fff}
.ic{width:20px;height:20px;flex:none}.en{font-family:var(--ff-en)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.skip-link{position:fixed;left:18px;top:10px;transform:translateY(-150%);z-index:120;background:var(--text);color:var(--bg);padding:10px 20px;border-radius:99px}.skip-link:focus{transform:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25)}


/* ---------- editor parts ---------- */

@media (min-width:1200px){ body.ed-open{padding-right:440px} }
.ed-panel{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;z-index:100;background:var(--surface-solid);color:var(--text);border-left:1px solid var(--line);
  box-shadow:-20px 0 60px rgba(30,36,80,.14);display:flex;flex-direction:column;font-size:13.5px;font-family:var(--ff-ja);animation:edIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes edIn{from{transform:translateX(30px);opacity:0}}
.ed-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ed-top .logo-mark{width:30px;height:30px;border-radius:10px}.ed-top .logo-mark svg{width:22px;height:22px}
.ed-top b{font-size:15px}
.ed-dirty{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:rgba(224,69,107,.12);color:#e0456b;display:none}
.ed-dirty.on{display:inline-block}
.ed-x{margin-left:auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-2)}
.ed-x:hover{background:var(--accent-soft)}
.ed-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.ed-tab{display:flex;align-items:center;gap:4px;padding:6px 9px;border-radius:10px;white-space:nowrap;font-size:12px;color:var(--text-2)}
.ed-tab .ic{width:15px;height:15px}
.ed-tab:hover{background:var(--accent-soft)}
.ed-tab.on{background:var(--text);color:var(--bg);font-weight:700}
.ed-body{flex:1;overflow:auto;padding:14px 16px 40px}
.ed-sec{margin-bottom:22px}
.ed-sec-t{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700;margin:2px 2px 10px;display:flex;align-items:center;gap:6px}
.ed-sec-t .ic{width:15px;height:15px}
.ed-field{margin-bottom:10px}
.ed-lab{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px;font-weight:700}
.ed-in{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);font:inherit;font-size:13.5px}
textarea.ed-in{min-height:78px;resize:vertical;line-height:1.6}
.ed-in:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=color].ed-in{padding:3px;height:38px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.ed-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ed-img{display:flex;gap:10px;align-items:flex-start}
.ed-img-prev{width:84px;height:84px;border-radius:12px;flex:none;overflow:hidden;border:1px dashed var(--line-strong);display:grid;place-items:center;font-size:11px;color:var(--muted);
  background:repeating-conic-gradient(var(--surface-2) 0 25%,transparent 0 50%) 0 0/14px 14px}
.ed-img-prev img{width:100%;height:100%;object-fit:cover}
.ed-img-prev.drag{outline:2px solid var(--accent);outline-offset:2px}
.ed-img-ctl{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.ed-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ed-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700}
.ed-btn:hover{filter:brightness(1.05)}
.ed-btn .ic{width:15px;height:15px}
.ed-btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--text-2)}
.ed-btn.primary{background:var(--text);color:var(--bg);padding:11px 16px;font-size:14px;justify-content:center;flex:1}
.ed-hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6}
.ed-item{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface-2)}
.ed-item[open]{border-color:var(--line-strong)}
.ed-item summary{list-style:none;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;cursor:pointer}
.ed-item summary::-webkit-details-marker{display:none}
.ed-sum-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:13px}
.ed-sum-t small{font-weight:400;color:var(--muted);margin-left:6px}
.ed-sum-thumb{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface-solid)}
.ed-sum-dot{width:12px;height:12px;border-radius:50%;flex:none}
.ed-sum-btns{display:flex;gap:2px}
.ed-mini{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ed-mini:hover{background:var(--accent-soft);color:var(--text)}
.ed-mini:disabled{opacity:.25;pointer-events:none}
.ed-mini.warn{background:#e0456b;color:#fff;width:auto;padding:0 8px;font-size:11.5px;font-weight:700}
.ed-mini .ic{width:15px;height:15px}
.ed-item-body{padding:10px 12px 12px;border-top:1px solid var(--line)}
.ed-add{width:100%;display:flex;justify-content:center;align-items:center;gap:6px;padding:10px;border-radius:12px;border:1.5px dashed var(--line-strong);color:var(--text-2);font-weight:700;font-size:13px;margin-bottom:8px}
.ed-add:hover{border-color:var(--accent);color:var(--accent)}
.ed-add .ic{width:16px;height:16px}
.ed-checks{display:flex;flex-wrap:wrap;gap:6px}
.ed-ck{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line-strong);font-size:12.5px;cursor:pointer;user-select:none}
.ed-ck input{position:absolute;opacity:0;pointer-events:none}
.ed-ck i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))}
.ed-ck.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.ed-ck.on i{background:#fff}
.ed-switch{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:10px}
.ed-switch input{width:17px;height:17px;accent-color:var(--accent)}
.ed-kv{display:grid;grid-template-columns:110px 1fr 28px;gap:6px;margin-bottom:6px;align-items:center}
.ed-icsel{display:flex;gap:8px;align-items:center}
.ed-icsel .pv{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ed-foot{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;flex:none;background:var(--surface-solid)}
.ed-size{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ed-fab{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:99px;background:var(--text);color:var(--bg);font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ed-fab .ic{width:17px;height:17px}
.ed-fab .dot{width:8px;height:8px;border-radius:50%;background:#ff6b8b;display:none}
.ed-fab .dot.on{display:block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:130;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:rise .3s}
.ed-info{font-size:12px;line-height:1.7;color:var(--text-2);background:var(--holo-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.ed-info b{color:var(--text)}
.ed-info ol{margin:6px 0 0;padding-left:18px}.ed-info li{margin:2px 0}
.ed-info code{font-size:11px;background:var(--surface-solid);padding:1px 5px;border-radius:5px}
.ed-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:rgba(242,165,58,.16);color:#c77a12;margin-left:6px}
.ed-status{font-size:12.5px;line-height:1.6;border-radius:12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);white-space:pre-wrap}
.ed-status:empty{display:none}
.ed-panel[data-tab="github"] #edPubStatus{display:none}
.ed-status.ok{background:rgba(57,181,151,.12);border-color:rgba(57,181,151,.35);color:#1f8a6f}
.ed-status.err{background:rgba(224,69,107,.1);border-color:rgba(224,69,107,.35);color:#c93a5e}
.ed-status.warn{background:rgba(242,165,58,.12);border-color:rgba(242,165,58,.4);color:#b56b0c}
.ed-status .ed-btn{margin-top:8px}
.ed-url{font-size:12px;word-break:break-all;color:var(--accent)}
.ed-btn:disabled{opacity:.5;pointer-events:none}
@media (max-width:760px){ .ed-panel{width:100vw} .ed-grid2{grid-template-columns:1fr} }

/* ---------- admin layout ---------- */
html,body{height:100%}
body{overflow:hidden;font-size:14px}
#admin{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}
.logo-mark{position:relative;overflow:hidden;width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--holo);border-radius:11px;box-shadow:0 6px 18px rgba(150,160,240,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.logo-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.55),transparent 45%)}
.logo-mark svg{width:26px;height:26px;position:relative;z-index:1}
.grow{flex:1}
.ed-btn{white-space:nowrap}

/* header */
.ad-hdr{flex:none;min-height:62px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);position:relative;z-index:30}
.ad-logo{display:flex;align-items:center;gap:10px;font:600 16.5px var(--ff-en);margin-right:6px;white-space:nowrap}
.ad-logo small{font:700 11px var(--ff-ja);color:var(--accent);margin-left:8px;letter-spacing:.08em}
.ad-src{font-size:11.5px;color:var(--text-2);padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.ad-hdr .ed-btn.primary{flex:none;padding:10px 16px}
.ad-hdr .ed-btn.ghost{padding:7px 10px}

/* body */
.ad-body{flex:1;min-height:0;display:grid;grid-template-columns:188px minmax(0,1fr) minmax(0,46%)}
.ad-side{border-right:1px solid var(--line);overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.ad-tab{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;font-size:13.5px;color:var(--text-2);text-align:left;transition:background .15s,color .15s}
.ad-tab:hover{background:var(--accent-soft);color:var(--text)}
.ad-tab.on{background:var(--holo-soft);color:var(--text);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.ad-tab .ic{width:18px;height:18px;color:var(--muted)}
.ad-tab.on .ic{color:var(--accent)}
.ad-tab:disabled{opacity:.35;pointer-events:none}
.ad-side hr{border:0;border-top:1px dashed var(--line-strong);margin:8px 6px;width:auto}
.ad-side .ed-size{margin-top:auto;padding:12px 6px 0;font-size:11px}
.ad-main{overflow:auto;padding:16px 22px 70px;min-width:0}
.ad-main>.ed-status{margin:-2px 0 14px}
.ad-body[data-tab="github"] #edPubStatus{display:none}
.ad-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:2px 0 14px}
.ad-h h2{font-size:21px}
.ad-h small{color:var(--muted);font-size:12px}
.ad-load{padding:24px 26px;margin-bottom:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.ad-load h2{font-size:20px}
.ad-load p{font-size:13px;color:var(--text-2)}

/* preview */
.ad-preview{position:relative;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.pv-bar{flex:none;height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{padding:5px 11px;border-radius:8px;font-size:12px;color:var(--text-2)}
.seg button.on{background:var(--text);color:var(--bg);font-weight:700}
.pv-wrap{position:relative;flex:1;min-height:0;overflow:hidden}
.pv-wrap iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:var(--bg)}
.pv-wrap.sp iframe{top:14px;border-radius:28px;box-shadow:0 0 0 8px #1d2238,0 20px 50px rgba(20,24,60,.3)}
.pv-close{display:none}

/* images */
.im-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.im-sum span{font-size:12px;padding:5px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--text-2)}
.im-group{margin-bottom:24px}
.im-group-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;font-weight:700;margin:0 2px 10px}
.im-group-h small{color:var(--muted);font-weight:400;font-size:12px}
.im-group-h .ed-row{margin:0 0 0 auto!important}
.im-group-h>.ed-btn{margin-left:auto}
.im-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.im-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,box-shadow .2s}
.im-card:hover{box-shadow:var(--shadow)}
.im-card.drag{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.im-thumb{position:relative;border-radius:11px;overflow:hidden;background:var(--surface-2)}
.im-thumb img{width:100%;height:100%;object-fit:cover}
.im-thumb img.is-ph{opacity:.5}
.im-chip{position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.92);color:#4a5272}
.im-chip.warn{background:#fff1da;color:#b56b0c}
.im-chip.ok{background:#e1f6ef;color:#1f8a6f}
.im-chip.none{background:rgba(255,255,255,.88);color:#8990ad}
.im-chip.ext{background:#e8ecff;color:#5563d6}
.im-meta{min-width:0;padding:0 2px}
.im-meta b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im-meta small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im-actions{display:flex;gap:4px;align-items:center}
.im-actions .ed-btn{flex:1;justify-content:center;padding:6px 8px}

/* links */
.lk-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto 30px;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.lk-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--c)}
.lk-ic .ic{width:18px;height:18px}
.lk-main{min-width:0}
.lk-main b{display:block;font-size:12.5px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-main .ed-in{padding:6px 9px;font-size:13px}
.lk-st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.lk-st.ok{background:rgba(57,181,151,.12);color:#1f8a6f}
.lk-st.none{background:var(--surface-2);color:var(--muted)}
.lk-st.err{background:rgba(224,69,107,.1);color:#c93a5e}

.ad-pv-toggle{display:none!important}
@media (max-width:1180px){
  .ad-body{grid-template-columns:170px minmax(0,1fr)}
  .ad-preview{display:none;position:fixed;inset:0;z-index:60;border:0;background:var(--bg)}
  .ad-preview.show{display:flex}
  .ad-pv-toggle{display:inline-flex!important}
  .pv-close{display:grid}
}
@media (max-width:760px){
  body{overflow:auto}
  #admin{height:auto;min-height:100vh}
  .ad-hdr{flex-wrap:wrap;padding:10px 12px;gap:6px}
  .ad-logo small,.ad-src{display:none}
  .hide-sp{display:none}
  .ad-body{grid-template-columns:minmax(0,1fr)}
  .ad-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;position:sticky;top:0;z-index:20;background:var(--bg)}
  .ad-tab{white-space:nowrap;padding:8px 10px}
  .ad-side hr,.ad-side .ed-size{display:none}
  .ad-main{overflow:visible;padding:14px 14px 60px}
  .im-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lk-row{grid-template-columns:32px minmax(0,1fr) 30px}
  .lk-st{grid-column:2;justify-self:start}
}

/* ---------- 背景透過（AI） ---------- */
.im-bg{justify-content:center;padding:5px 8px;font-size:12px}
.im-thumb{background:repeating-conic-gradient(var(--surface-2) 0 25%,transparent 0 50%) 0 0/14px 14px}
.bg-modal-back{position:fixed;inset:0;z-index:200;background:rgba(14,16,36,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.bg-modal{width:min(980px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface-solid);border-radius:24px;box-shadow:0 30px 80px rgba(20,24,60,.35);display:flex;flex-direction:column}
.bg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.bg-head b{font-size:16px}
.bg-body{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 18px 6px}
.bg-pane{display:flex;flex-direction:column;gap:8px;min-width:0}
.bg-pane small{font-size:12px;color:var(--text-2);font-weight:700}
.bg-pane-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bg-pane-h .seg button{padding:3px 9px;font-size:11.5px}
.bg-view{position:relative;height:min(52vh,440px);border-radius:16px;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line)}
.bg-view img,.bg-view canvas{max-width:100%;max-height:100%;object-fit:contain;display:block}
.bg-view.checker{background:repeating-conic-gradient(#e3e6f1 0 25%,#fff 0 50%) 0 0/20px 20px}
.bg-view.site{background:radial-gradient(80% 60% at 50% 30%,color-mix(in srgb,var(--c) 34%,transparent),transparent 72%),linear-gradient(180deg,color-mix(in srgb,var(--c) 8%,var(--surface-solid)),color-mix(in srgb,var(--c) 26%,var(--surface-solid)))}
.bg-view.white{background:#fff}
.bg-view.black{background:#14172b}
.bg-busy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-size:13px;font-weight:700;color:var(--text-2);background:color-mix(in srgb,var(--surface-solid) 80%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.bg-busy.err{color:#c93a5e}
.bg-bar{width:70%;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bg-bar i{display:block;height:100%;width:0;background:var(--holo);transition:width .2s}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bg-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;padding:8px 18px 0}
.bg-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line);margin-top:8px}
@media (max-width:760px){.bg-body,.bg-ctrl{grid-template-columns:1fr}.bg-view{height:min(40vh,360px)}}

/* ---------- 履歴から復元 ---------- */
.hist-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.hist-main{min-width:0}
.hist-main b{display:flex;align-items:center;gap:6px;font-size:13px}
.hist-main small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-now{font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.hist-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.hist-tag.ok{background:rgba(57,181,151,.12);color:#1f8a6f}
@media (max-width:760px){.hist-row{grid-template-columns:minmax(0,1fr) auto}.hist-tag{grid-column:1;justify-self:start}}

/* ---------- 画像カードのタイトル ---------- */
.im-title{display:block;width:calc(100% + 12px);margin:-4px -6px 0;padding:3px 6px;border:1px solid transparent;border-radius:8px;background:transparent;font:700 12.5px var(--ff-ja);color:var(--text)}
.im-title:hover{border-color:var(--line-strong)}
.im-title:focus{outline:0;border-color:var(--accent);background:var(--surface-2)}
.ed-sum-dot{box-shadow:0 0 0 1px rgba(40,50,100,.18)}
/* ---------- 背景をまとめて消す ---------- */
.bb-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 18px 4px}
.bb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:10px 18px;max-height:50vh;overflow:auto}
.bb-card{position:relative;border:1px solid var(--line);border-radius:14px;padding:6px;background:var(--surface);cursor:pointer;transition:border-color .2s,box-shadow .2s,opacity .2s}
.bb-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bb-card:not(.sel){opacity:.55}
.bb-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:var(--surface-2)}
.bb-thumb img,.bb-thumb canvas{width:100%;height:100%;object-fit:contain;display:block}
.bb-grid.checker .bb-thumb.done{background:repeating-conic-gradient(#e3e6f1 0 25%,#fff 0 50%) 0 0/14px 14px}
.bb-grid.white .bb-thumb.done{background:#fff}
.bb-grid.black .bb-thumb.done{background:#14172b}
.bb-grid.site .bb-thumb.done{background:radial-gradient(80% 60% at 50% 30%,color-mix(in srgb,var(--c) 34%,transparent),transparent 72%),linear-gradient(180deg,color-mix(in srgb,var(--c) 8%,var(--surface-solid)),color-mix(in srgb,var(--c) 26%,var(--surface-solid)))}
.bb-check{position:absolute;top:10px;left:10px;z-index:2;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(40,50,100,.2);color:transparent}
.bb-card.sel .bb-check{background:var(--accent);color:#fff}
.bb-check .ic{width:14px;height:14px}
.bb-state{position:absolute;right:10px;top:10px;z-index:2;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.92);color:#4a5272}
.bb-state:empty{display:none}
.bb-state.run{background:#e8ecff;color:#5563d6}.bb-state.done{background:#e1f6ef;color:#1f8a6f}.bb-state.err{background:#fde6ec;color:#c93a5e}.bb-state.skip{background:#f1f2f7;color:#8990ad}
.bb-card b{display:block;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-card small{display:block;font-size:10.5px;color:var(--muted)}
.bb-msg{font-size:12.5px;font-weight:700;color:var(--text-2)}
.bb-foot-bar{flex:1;min-width:140px;display:flex;flex-direction:column;gap:6px}

/* ---------- シェア表示のプレビュー ---------- */
.sc-card{max-width:520px;border:1px solid var(--line-strong);border-radius:16px;overflow:hidden;background:var(--surface-solid)}
.sc-img{aspect-ratio:1200/630;background:var(--surface-2);display:grid;place-items:center}
.sc-img img{width:100%;height:100%;object-fit:cover;display:block}
.sc-img.none{font-size:12px;color:var(--muted);padding:20px;text-align:center;aspect-ratio:auto;min-height:90px}
.sc-body{padding:10px 14px 12px;display:flex;flex-direction:column;gap:2px}
.sc-body small{font-size:12px;color:var(--muted)}
.sc-body b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-body p{font-size:12.5px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- 表示位置（サムネイル） ---------- */
.fc{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:start}
.fc-frame{position:relative;overflow:hidden;border-radius:14px;background:var(--holo-soft),var(--surface-2);cursor:grab;touch-action:none;user-select:none;box-shadow:inset 0 0 0 1px var(--line-strong)}
.fc-frame.drag{cursor:grabbing;box-shadow:inset 0 0 0 2px var(--accent)}
.fc-frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.fc-hint{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.9);color:#4a5272;pointer-events:none}
.fc-hint .ic{width:13px;height:13px}
.fc-ctl{display:flex;flex-direction:column;gap:6px}
.fc-ctl input[type=range]{width:100%}
.fc-pos{font-size:11.5px;color:var(--text-2);line-height:1.5}
.fc-back{background:rgba(14,16,36,.35);-webkit-backdrop-filter:none;backdrop-filter:none}
.im-actions+.im-actions{margin-top:-2px}
@media (max-width:760px){.fc{grid-template-columns:1fr}}

</style>
</head>

/* 保存データに足りない項目を初期値で補う */
function mergeData(d) {
  const base = JSON.parse(JSON.stringify(DEFAULT));
  if (!d || typeof d !== 'object') return base;
  d = JSON.parse(JSON.stringify(d));
  for (const k of Object.keys(base)) if (!(k in d)) d[k] = base[k];
  for (const k of ['site','home','hero','tiles','pages','patreon','faq','guide','downloads','gate','share']) d[k] = Object.assign({}, base[k], d[k] || {});
  if (Array.isArray(d.nav)) base.nav.forEach((n, i) => { if (!d.nav.some(x => x && x.id === n.id)) d.nav.splice(Math.min(i, d.nav.length), 0, n); });   // 新しいページをメニューに追加
  for (const k of Object.keys(base.tiles)) d.tiles[k] = Object.assign({}, base.tiles[k], d.tiles[k] || {});
  for (const k of Object.keys(base.pages)) d.pages[k] = Object.assign({}, base.pages[k], d.pages[k] || {});
  (d.characters || []).forEach(c => {   // 以前の初期カラーのままなら新しいイメージカラーへ
    const col = String(c.color || '').toLowerCase();
    if (c.id === 'tamaki' && ['#ada2e3', '#e2b04f'].includes(col)) c.color = '#ffffff';
    if (c.id === 'kaede' && ['#eeb22c', '#ef8a4c'].includes(col)) c.color = '#f5c518';
  });
  const pt = d.patreon;
  if (Array.isArray(pt.tiers) && pt.tiers.map(t => t && t.name).join() === 'Star,Comet,Galaxy') {   // 仮プランのままなら実プランに置き換え
    pt.tiers = base.patreon.tiers;
    if (/^高解像度イラストや差分/.test(pt.lead || '')) pt.lead = base.patreon.lead;
    if (/^※ 限定コンテンツの本編は/.test(pt.note || '')) pt.note = base.patreon.note;
    (pt.previews || []).forEach(x => { if (x.tier === 'Star') x.tier = 'basic'; if (x.tier === 'Comet') x.tier = 'Extra'; });
  }
  if (!pt.oshi || typeof pt.oshi !== 'object') pt.oshi = base.patreon.oshi;
  if (!Array.isArray(pt.oshi.items)) pt.oshi.items = [];
  return d;
}

  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;

/* ---------- image processing ---------- */
function hasAlpha(c) {
  const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  for (let i = 3; i < d.length; i += 16) if (d[i] < 250) return true;
  return false;
}
function fileToDataURL(file, max = 1600) {
  return new Promise((resolve, reject) => {
    if (/gif|svg/.test(file.type) && file.size < 3 * 1024 * 1024) {       // GIF/SVG はそのまま
      const fr = new FileReader(); fr.onload = () => resolve(fr.result); fr.onerror = reject; fr.readAsDataURL(file); return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * s));
      c.height = Math.max(1, Math.round(img.naturalHeight * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let d = c.toDataURL('image/webp', 0.86);
      if (!d.startsWith('data:image/webp')) d = /png|webp/.test(file.type) && hasAlpha(c) ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.88);
      URL.revokeObjectURL(url);
      resolve(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}
const kb = s => Math.round(String(s || '').length * 0.75 / 1024);
const extOf = d => { const m = /^data:image\/([a-z0-9+.-]+)/i.exec(d || ''); const e = m ? m[1].toLowerCase() : 'png'; return e === 'jpeg' ? 'jpg' : e.startsWith('svg') ? 'svg' : e; };
async function fileToAsset(file, max, folder) {
  const d = await fileToDataURL(file, max);
  const base = file.name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'img';
  const path = `images/${folder || 'misc'}/${base}-${uid().slice(0, 5)}.${extOf(d)}`;
  ASSETS.set(path, d);
  return path;
}

function extractEmbedded(root) {
  let n = 0;
  const conv = d => { const p = `images/uploads/img-${hashStr(d).toString(36)}.${extOf(d)}`; ASSETS.set(p, d); n++; return p; };
  const walk = x => {
    if (!x || typeof x !== 'object') return;
    for (const k of Object.keys(x)) {
      const v = x[k];
      if (typeof v === 'string' && v.startsWith('data:image/')) x[k] = conv(v);
      else if (v && typeof v === 'object') walk(v);
    }
  };
  walk(root);
  return n;
}

function fFocus(label, obj, o) {

const readAsDataURL = f => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('ファイルを読み込めませんでした')); fr.readAsDataURL(f); });
const imgDims = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res({w:i.naturalWidth, h:i.naturalHeight}); i.onerror = () => rej(new Error('画像を読み込めませんでした')); i.src = src; });
const fmtBytes = n => n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
async function dlFromFile(f, x) {
  if (!/^image\//.test(f.type)) throw new Error('画像ファイルを選んでください');
  if (f.size > 25 * 1048576) throw new Error('25MBより大きい画像は配布できません');
  const orig = await readAsDataURL(f);
  const dims = await imgDims(orig);
  const ext = (/(png|jpe?g|webp|gif)/i.exec(f.type) || /\.(png|jpe?g|webp|gif)$/i.exec(f.name) || [, 'png'])[1].toLowerCase().replace('jpeg', 'jpg');
  const base = f.name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'image';
  const fp = `images/downloads/${base}-${uid().slice(0, 5)}.${ext}`;
  ASSETS.set(fp, orig);
  x = x || {id:'d' + uid(), title:f.name.replace(/\.[^.]+$/, ''), note:'', chars:[]};
  x.file = fp; x.bytes = f.size; x.size = `${dims.w}×${dims.h}`;
  x.image = await fileToAsset(f, 900, 'downloads/preview');
  const r = dims.w / dims.h;
  if (!x.type || x.autoType !== false) x.type = Math.abs(r - 1) < 0.08 ? 'icon' : r > 1 ? 'pc' : 'sp';
  return x;
}
function dlFileField(x, refresh) {
  const prev = h('div', {class:'ed-img-prev'});
  const info = h('p', {class:'ed-hint', style:'margin:0'});
  const paint = () => {
    const v = x.image || x.file;
    prev.innerHTML = v ? `<img src="${esc(imgSrc(v))}" alt="">` : '<span>未設定</span>';
    info.textContent = x.file ? `${x.size || ''}${x.bytes ? ' ／ ' + fmtBytes(x.bytes) : ''}${ASSETS.has(x.file) && !UPLOADED.has(x.file) ? '（未公開）' : ''}` : '選んだ画像は元の画質のまま配布用に保存されます。';
  };
  const file = h('input', {type:'file', accept:'image/*', hidden:true, onchange:async () => {
    const f = file.files[0]; file.value = ''; if (!f) return;
    try { await dlFromFile(f, x); paint(); changed(); refresh && refresh(); } catch (e) { toast(e.message); }
  }});
  paint();
  return wrapField('配布する画像', h('div', {class:'ed-img'}, prev, h('div', {class:'ed-img-ctl'},
    h('div', {class:'ed-row'}, h('button', {class:'ed-btn', type:'button', html:icon('upload') + '画像を選ぶ', onclick:() => file.click()})), info, file)));
}

/* ---------- ZIP（手動アップ用・無圧縮） ---------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type:'application/zip'});
}
const b64ToU8 = b64 => { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

const GH_KEY = 'ryuse1-studio-github';
const GH = {owner:'', repo:'', branch:'main', dir:'', token:'', remember:false};
function ghLoad() {
  try { const j = JSON.parse(localStorage.getItem(GH_KEY) || 'null'); if (j) Object.assign(GH, j); } catch (e) {}
}
function ghSave() {
  try {
    const o = {owner:GH.owner, repo:GH.repo, branch:GH.branch, dir:GH.dir, remember:GH.remember};
    if (GH.remember) o.token = GH.token;
    localStorage.setItem(GH_KEY, JSON.stringify(o));
  } catch (e) {}
}
const ghReady = () => GH.owner && GH.repo && GH.token;
const ghJoin = p => { const d = String(GH.dir || '').replace(/^\/+|\/+$/g, ''); return d ? `${d}/${p}` : p; };
function ghSiteUrl() {
  if (!GH.owner || !GH.repo) return '';
  const o = GH.owner.toLowerCase(), r = GH.repo.toLowerCase();
  const base = r === `${o}.github.io` ? `https://${o}.github.io/` : `https://${o}.github.io/${GH.repo}/`;
  const d = String(GH.dir || '').replace(/^\/+|\/+$/g, '');
  return base + (d && d !== 'docs' ? d + '/' : '');
}
class GhError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function ghApi(path, opt = {}) {
  let r;
  try {
    r = await fetch(`https://api.github.com/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}${path}`, {
      method: opt.method || 'GET',
      headers: Object.assign({
        'Authorization': `Bearer ${GH.token.trim()}`,
        'Accept': opt.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      }, opt.body ? {'Content-Type':'application/json'} : {}),
      body: opt.body ? JSON.stringify(opt.body) : undefined,
      cache: 'no-store'
    });
  } catch (e) { throw new GhError(0, 'network'); }
  if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) {} throw new GhError(r.status, m); }
  return opt.raw ? r.text() : r.json();
}
function ghErrorText(e) {
  const st = e.status;
  if (st === 0) return 'GitHubに接続できませんでした。ネット接続を確認してください。';
  if (st === 401) return 'トークンが正しくないか、期限切れです。「公開設定」でトークンを入れ直してください。';
  if (st === 403) return 'トークンの権限が足りません。Fine-grained token の Permissions で「Contents: Read and write」を付けてください。';
  if (st === 404) return 'リポジトリかブランチが見つかりません。ユーザー名・リポジトリ名・ブランチ名と、トークンの対象リポジトリを確認してください。';
  if (st === 409) return 'リポジトリが空のようです。GitHubでリポジトリ作成時に「Add a README file」をONにするか、ファイルを1つ作ってから公開してください。';
  if (st === 422) return `GitHubがデータを受け付けませんでした（${e.message}）。`;
  return `エラーが発生しました（${st} ${e.message}）。`;
}

function importJSON(e) {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const raw = JSON.parse(fr.result);
      const d = raw && raw.data && Array.isArray(raw.data.characters) ? raw.data : raw;
      if (!d || typeof d !== 'object' || !Array.isArray(d.characters)) throw new Error();
      if (raw.assets && typeof raw.assets === 'object') for (const [p, v] of Object.entries(raw.assets)) if (typeof v === 'string' && v.startsWith('data:image/')) ASSETS.set(p, v);
      S.data = mergeData(d);
      changed(); drawAll(); toast('バックアップを読み込みました');
    } catch (err) { toast('読み込めませんでした（JSONを確認してください）'); }
  };
  fr.readAsText(f);
}



/* =========================================================
   設定データ（data.json）の保存・読み込み・履歴からの復元
   ・設定は data.json に保存するので、index.html / admin.html を差し替えても消えない
   ・index.html にも同じ内容を埋め込む（data.json が読めない時の予備）
   ========================================================= */
async function readRemoteFile(path, ref) {
  try {
    const text = await ghApi(`/contents/${ghJoin(path).split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(ref)}`, {raw:true});
    return {exists:true, text};
  } catch (e) {
    if (e.status === 404) return {exists:false, text:''};
    throw e;
  }
}
const parseJSONSafe = t => { try { return JSON.parse(t); } catch (e) { return null; } };
const embeddedOf = html => { try { return parseSiteData(html); } catch (e) { return null; } };
async function readRemoteState(ref) {
  const [idx, dj] = await Promise.all([readRemoteFile('index.html', ref), readRemoteFile('data.json', ref)]);
  const json = dj.exists ? parseJSONSafe(dj.text) : null;
  const emb = idx.exists ? embeddedOf(idx.text) : null;
  const data = json || emb;
  return {idx, hasJson:!!json, data, stamp:(data && data.publishedAt) || null};
}
async function publish(force) {
  if (ED.busy) return;
  if (!ghReady()) { ED.tab = 'github'; drawAll(); setPubStatus('最初に「公開設定」でGitHubと接続してください。', 'warn'); return; }
  const btn = $('#edPubBtn');
  ED.busy = true; if (btn) btn.disabled = true;
  const prevStamp = D().publishedAt;
  try {
    const branch = (GH.branch || 'main').trim();
    setPubStatus('GitHubを確認しています…');
    const ref = await ghApi(`/git/ref/heads/${encodeURIComponent(branch)}`);
    const baseSha = ref.object.sha;
    const baseCommit = await ghApi(`/git/commits/${baseSha}`);
    const remote = await readRemoteState(branch);
    if (!force && remote.stamp && remote.stamp !== S.loadedStamp) {
      setPubStatus('GitHub上に、このページを開いた後に公開された新しい版があります。\nこのまま公開すると、その内容を上書きします。\n（別のPCで編集した場合などは、「読み込み直す」を押してから編集し直すのが安全です）', 'warn',
        {label:'上書きして公開する', fn:() => publish(true)});
      return;
    }
    const tpl = remote.idx.exists && remote.idx.text.includes('rs-preview') ? remote.idx.text : S.template;
    if (!tpl) throw new Error('index.html が読み込まれていません');
    const moved = extractEmbedded(D());
    const stamp = new Date().toISOString();
    D().publishedAt = stamp;
    const assets = pendingAssets();
    const files = assets.map(p => ({path:ghJoin(p), b64:ASSETS.get(p).split(',')[1], asset:p}));
    files.push({path:ghJoin('data.json'), b64:utf8ToB64(JSON.stringify(D(), null, 1))});
    const built = buildFromTemplate(tpl);
    files.push({path:ghJoin('index.html'), b64:utf8ToB64(built)});
    const tree = [];
    for (let i = 0; i < files.length; i++) {
      setPubStatus(`アップロード中… ${i + 1} / ${files.length}`);
      const b = await ghApi('/git/blobs', {method:'POST', body:{content:files[i].b64, encoding:'base64'}});
      tree.push({path:files[i].path, mode:'100644', type:'blob', sha:b.sha});
    }
    setPubStatus('保存しています…');

const fmtDT = d => { try { return new Date(d).toLocaleString('ja-JP', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}); } catch (e) { return String(d); } };

async function loadHistory(box) {
  if (!ghReady()) { setPubStatus('先にGitHubと接続してください（ユーザー名・リポジトリ名・トークン）。', 'warn'); return; }
  box.replaceChildren(h('p', {class:'ed-hint'}, '履歴を読み込んでいます…'));
  const branch = (GH.branch || 'main').trim();
  const q = p => ghApi(`/commits?path=${encodeURIComponent(ghJoin(p))}&sha=${encodeURIComponent(branch)}&per_page=40`).catch(e => { if (e.status === 404) return []; throw e; });
  try {
    const [dj, idx] = await Promise.all([q('data.json'), q('index.html')]);
    const map = new Map();
    const add = (c, file) => map.set(c.sha, {sha:c.sha, file, date:(c.commit.committer || c.commit.author || {}).date || '', msg:String(c.commit.message || '').split('\n')[0]});
    (idx || []).forEach(c => add(c, 'index.html'));
    (dj || []).forEach(c => add(c, 'data.json'));

    if (!list.length) { box.replaceChildren(h('p', {class:'ed-hint'}, '履歴が見つかりませんでした。')); return; }
    box.replaceChildren(...list.map((it, i) => {

        h('span', {class:'hist-tag' + (byAdmin ? ' ok' : '')}, byAdmin ? '管理ページから公開' : '手動アップロード'),
        h('button', {class:'ed-btn ghost', type:'button', onclick:() => restoreFrom(it)}, '読み込む'));
    }));
  } catch (e) {
    box.replaceChildren(h('p', {class:'ed-hint'}, e instanceof GhError ? ghErrorText(e) : `エラー：${e.message}`));
  }
}
async function restoreFrom(it) {
  const go = async () => {
    setPubStatus('過去の版を読み込んでいます…');
    try {
      const f = await readRemoteFile(it.file, it.sha);
      const d = !f.exists ? null : it.file === 'data.json' ? parseJSONSafe(f.text) : embeddedOf(f.text);
      if (!d) { setPubStatus('この版には設定が入っていません（初期状態の版です）。「管理ページから公開」の版を選んでください。', 'warn'); return; }
      const cur = await readRemoteState((GH.branch || 'main').trim());

      S.loadedStamp = cur.stamp;

/* =========================================================
   SNSでシェアされた時のカード（OGP / X カード）
   ・index.html の <head> に meta タグを書き込む（公開時に自動）
   ・X などは JavaScript を実行しないので、ページの中身ではなくここで決めた内容が表示される

function siteBaseUrl() {
  const sh = D().share || {};
  let u = String(sh.url || '').trim();
  if (!u) u = /^https?:$/.test(location.protocol) ? new URL('./', location.href).href : ghSiteUrl();
  if (u && !u.endsWith('/')) u += '/';
  return u;
}
function shareValues() {
  const s = D().site, sh = D().share || {};
  const xs = (D().sns || []).find(x => x.icon === 'x' && /^@/.test(x.handle || ''));
  const base = siteBaseUrl();
  const abs = u => { if (!u) return ''; if (/^https?:/i.test(u)) return u; try { return base ? new URL(u, base).href : ''; } catch (e) { return ''; } };
  return {
    base,
    title: String(sh.title || `${s.name} ${s.suffix}`.trim()),
    desc: String(sh.description || s.bio || s.tagline || '').replace(/\s+/g, ' ').trim(),
    image: abs(sh.image),
    twitter: String(sh.twitter || (xs ? xs.handle : '')).trim(),
    siteName: `${s.name} ${s.suffix}`.trim()
  };
}
function shareMetaBlock() {
  const v = shareValues();
  const tags = [
    ['property', 'og:type', 'website'],
    ['property', 'og:site_name', v.siteName],
    ['property', 'og:title', v.title],
    ['property', 'og:description', v.desc],
    v.base && ['property', 'og:url', v.base],
    v.image && ['property', 'og:image', v.image],
    v.image && ['property', 'og:image:width', '1200'],
    v.image && ['property', 'og:image:height', '630'],
    ['property', 'og:locale', 'ja_JP'],
    ['name', 'twitter:card', v.image ? 'summary_large_image' : 'summary'],
    ['name', 'twitter:title', v.title],
    ['name', 'twitter:description', v.desc],
    v.image && ['name', 'twitter:image', v.image],
    v.twitter && ['name', 'twitter:site', v.twitter],
    ['name', 'theme-color', '#bdb4ff']
  ].filter(Boolean);
  return '<!-- share:start -->\n' + tags.map(([a, k, val]) => `<meta ${a}="${k}" content="${esc(val)}">`).join('\n') + '\n<!-- share:end -->';
}
function applyShareMeta(html) {
  const block = shareMetaBlock(), v = shareValues();
  html = /<!-- share:start -->[\s\S]*?<!-- share:end -->/.test(html)
    ? html.replace(/<!-- share:start -->[\s\S]*?<!-- share:end -->/, () => block)
    : html.replace(/(<meta name="description"[^>]*>)/, (m) => m + '\n' + block);
  if (v.desc) html = html.replace(/(<meta name="description" content=")[^"]*(")/, (m, a, b) => a + esc(v.desc) + b);
  return html;
}

function roundRectPath(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function drawCover(g, img, x, y, w, h, posY = .3) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = Math.max(w / iw, h / ih), sw = w / s, sh = h / s;
  g.drawImage(img, (iw - sw) / 2, Math.max(0, Math.min(ih - sh, (ih - sh) * posY)), sw, sh, x, y, w, h);
}
function wrapLines(g, text, maxW, maxLines) {
  const out = []; let line = '';
  for (const ch of String(text)) {
    if (g.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; if (out.length === maxLines) break; }
    else line += ch;
  }
  if (out.length < maxLines && line) out.push(line);
  if (out.length === maxLines && (out.join('').length < String(text).length)) out[maxLines - 1] = out[maxLines - 1].replace(/.$/, '…');
  return out;
}

/* =========================================================
   背景透過（AI・ブラウザ内で処理）
   モデル：skytnt/anime-seg（ISNet・Apache-2.0） / 実行：onnxruntime-web
   ========================================================= */
const BG = {
  ortVer: '1.22.0',
  modelUrl: 'https://huggingface.co/skytnt/anime-seg/resolve/main/isnetis.onnx',
  cacheName: 'rs-bg-model-v1',
  size: 1024,
  session: null, model: null, ep: '', loading: null
};
const ortBase = () => `https://cdn.jsdelivr.net/npm/onnxruntime-web@${BG.ortVer}/dist/`;
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res;
    s.onerror = () => rej(new Error('AIの実行ライブラリを読み込めませんでした（ネット接続を確認してください）'));
    document.head.append(s);
  });
}
async function bgCache() { try { return window.caches ? await caches.open(BG.cacheName) : null; } catch (e) { return null; } }

async function fetchModel(onStatus) {
  const cache = await bgCache();
  if (cache) {
    try { const hit = await cache.match(BG.modelUrl); if (hit) { onStatus('AIモデルを読み込んでいます（保存済み）…', 1); return new Uint8Array(await hit.arrayBuffer()); } } catch (e) {}
  }
  let r;
  try { r = await fetch(BG.modelUrl); } catch (e) { throw new Error('AIモデルをダウンロードできませんでした（ネット接続を確認してください）'); }
  if (!r.ok) throw new Error(`AIモデルをダウンロードできませんでした（${r.status}）`);
  const total = +r.headers.get('content-length') || 0;
  const reader = r.body.getReader(), chunks = [];
  let got = 0;
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    onStatus(`AIモデルをダウンロード中… ${total ? Math.round(got / total * 100) + '%' : Math.round(got / 1048576) + 'MB'}（初回のみ）`, total ? got / total : 0);
  }
  const buf = new Uint8Array(got);
  let off = 0; for (const c of chunks) { buf.set(c, off); off += c.length; }
  if (cache) { try { await cache.put(BG.modelUrl, new Response(new Blob([buf]), {headers:{'Content-Type':'application/octet-stream'}})); } catch (e) {} }
  return buf;
}
async function createSession(eps) {
  let lastErr;
  for (const ep of eps) {
    try {
      const s = await ort.InferenceSession.create(BG.model, {executionProviders:[ep], graphOptimizationLevel:'all'});
      BG.session = s; BG.ep = ep; return s;
    } catch (e) { lastErr = e; }
  }
  throw new Error('AIを起動できませんでした：' + (lastErr && lastErr.message || lastErr));
}
async function ensureBgSession(onStatus) {
  if (BG.session) return BG.session;
  if (BG.loading) return BG.loading;
  BG.loading = (async () => {
    if (!window.ort) { onStatus('AIの準備をしています…', 0); await loadScript(ortBase() + 'ort.webgpu.min.js'); }
    ort.env.wasm.wasmPaths = ortBase();
    ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 2) : 1;
    if (!BG.model) BG.model = await fetchModel(onStatus);
    onStatus('AIを起動しています…', 1);
    let hasGpu = false;
    try { hasGpu = !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch (e) {}
    return createSession(hasGpu ? ['webgpu', 'wasm'] : ['wasm']);
  })();
  try { return await BG.loading; } finally { BG.loading = null; }
}
async function computeMask(img) {

function parseSiteData(html) {
  const m = /<script id="site-data" type="application\/json">([\s\S]*?)<\/script>/.exec(html);
  if (!m) throw new Error('RyuSe1 STUDIO の index.html ではないようです（site-data が見つかりません）');

}
function loadTemplate(html, source, data) {
  const d = arguments.length > 2 ? data : parseSiteData(html);

  S.template = html;
  S.source = source;
  S.loadedStamp = S.data.publishedAt || null;
  S.oldTemplate = !html.includes('rs-preview');
  UPLOADED.clear();
  ED.dirty = false; updateDirty();
  RS_BASE = previewBase();
  buildPreviewFrame();
  drawAll();
  if (S.oldTemplate) setPubStatus('この index.html は古い版です（編集パネル付き）。新しい index.html を一度GitHubにアップしてから使ってください。プレビューが更新されません。', 'warn');
}
async function loadFromGitHub() {

    if (!r.idx.exists) { setPubStatus('GitHubのリポジトリに index.html がありません。先に index.html をアップロードしてください。', 'err'); return; }

/* ---------- プレビュー（index.html を iframe で表示） ---------- */
const PV = {frame:null, url:'', ready:false, sent:new Set(), mode:'pc', route:'#/home', timer:null};
function previewBase() {
  if (/^https?:$/.test(location.protocol)) return new URL('./', location.href).href;
  return ghSiteUrl() || new URL('./', location.href).href;
}
function injectData(html, data) {
  const json = JSON.stringify(data).replace(/</g, '\\u003c');
  return html.replace(/(<script id="site-data" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
}
function buildPreviewFrame() {
  if (!PV.frame || !S.template) return;
  const flag = `<script>window.RS_PREVIEW=1;window.RS_BASE=${JSON.stringify(RS_BASE)};window.RS_ROUTE=${JSON.stringify(PV.route)};<\/script>`;
  const html = injectData(S.template, S.data).replace(/<head>/i, m => m + flag);
  if (PV.url) URL.revokeObjectURL(PV.url);
  PV.url = URL.createObjectURL(new Blob([html], {type:'text/html'}));
  PV.ready = false; PV.sent = new Set();
  PV.frame.src = PV.url;
}
function sendPreview() {
  if (!PV.ready || !PV.frame || !S.data) return;
  const w = PV.frame.contentWindow;
  const add = {};
  for (const [p, d] of ASSETS) if (!PV.sent.has(p)) { add[p] = d; PV.sent.add(p); }
  if (Object.keys(add).length) w.postMessage({type:'rs-assets', assets:add}, '*');
  w.postMessage({type:'rs-preview', data:S.data}, '*');
}
function schedulePreview() { clearTimeout(PV.timer); PV.timer = setTimeout(sendPreview, 220); }
function previewRoute(r) {
  if (!r) return;
  PV.route = r;
  if (PV.ready) PV.frame.contentWindow.postMessage({type:'rs-route', route:r}, '*');
}
window.addEventListener('message', e => {
  if (!PV.frame || e.source !== PV.frame.contentWindow) return;
  if (e.data && e.data.type === 'rs-ready') { PV.ready = true; sendPreview(); }
});
function fitPreview() {
  const wrap = $('#pvWrap'), f = PV.frame;
  if (!wrap || !f) return;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  wrap.classList.toggle('sp', PV.mode === 'sp');
  if (PV.mode === 'pc') {
    const vw = 1360, sc = Math.min(1, W / vw);
    Object.assign(f.style, {width:vw + 'px', height:(H / sc) + 'px', transform:`scale(${sc})`, left:'0px'});
  } else {
    const vw = 390, vh = Math.max(400, Math.min(844, H - 28)), sc = Math.min(1, (W - 28) / vw);
    Object.assign(f.style, {width:vw + 'px', height:(vh / sc) + 'px', transform:`scale(${sc})`, left:Math.max(14, (W - vw * sc) / 2) + 'px'});
  }
}

/* ---------- 画像一覧 ---------- */
function imageSlots() {

  d.patreon.previews.forEach((x, i) => out.push({group:'Patreon プレビュー', label:x.title || '(無題)', titleKey:'title', hint:'ぼかして表示', obj:x, key:'image', max:420, folder:'patreon', ph:phArt('pv' + i, '', SOFT[i % SOFT.length]), ratio:'3/4'}));
  return out;

function imgState(v) {
  if (!v) return ['未設定', 'none'];
  if (v.startsWith('data:')) return ['埋め込み', 'warn'];
  if (ASSETS.has(v) && !UPLOADED.has(v)) return ['未公開', 'warn'];
  if (/^https?:/i.test(v)) return ['外部URL', 'ext'];
  return ['公開済み', 'ok'];
}
function imageCard(sl) {

  const chip = h('span', {class:'im-chip'});

    const v = sl.obj[sl.key] || '';

    img.classList.toggle('is-ph', !v);
    const [t, k] = imgState(v); chip.textContent = t; chip.className = 'im-chip ' + k;
  };
  const set = async f => {
    if (!f || !/^image\//.test(f.type)) return;
    try { sl.obj[sl.key] = await fileToAsset(f, sl.max, sl.folder); paint(); changed(); refreshImageSummary(); }
    catch (e) { toast(e.message); }
  };
  const file = h('input', {type:'file', accept:'image/*', hidden:true, onchange:() => { set(file.files[0]); file.value = ''; }});
  const card = h('div', {class:'im-card'},
    h('div', {class:'im-thumb', style:`aspect-ratio:${sl.ratio || '1'}`}, img, chip),
    h('div', {class:'im-meta'}, sl.titleKey ? titleInput(sl) : h('b', {title:sl.label}, sl.label), h('small', {}, sl.hint || ' ')),
    h('div', {class:'im-actions'},
      h('button', {class:'ed-btn', type:'button', html:icon('upload') + '差し替え', onclick:() => file.click()}),
      h('button', {class:'ed-mini', type:'button', title:'画像を外す', html:icon('trash'), onclick:() => { sl.obj[sl.key] = ''; paint(); changed(); refreshImageSummary(); }}),
      file),
    h('div', {class:'im-actions'},
      h('button', {class:'ed-btn ghost im-bg', type:'button', title:'AIで背景を消して透過にする', html:icon('wand') + '背景を消す',
        onclick:() => openBgRemove(sl, () => { paint(); refreshImageSummary(); })}),
      sl.focus ? h('button', {class:'ed-btn ghost im-bg', type:'button', title:'サムネイルで見える場所を決める', html:icon('image') + '表示位置',
        onclick:() => openFocusModal(sl)}) : null));
  card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('drag'); });
  card.addEventListener('dragleave', () => card.classList.remove('drag'));

}
function titleInput(sl) {

}
function openFocusModal(sl) {

  const onKey = e => { if (e.key === 'Escape') close(); };
  const back = h('div', {class:'bg-modal-back fc-back', onclick:e => { if (e.target === back) close(); }},

      h('div', {class:'bg-head'}, h('span', {class:'logo-mark', html:LOGO_SVG}), h('b', {}, '表示位置'), h('span', {class:'grow'}),

function refreshImageSummary() {
  const el = $('#imSum'); if (!el) return;

  const slots = imageSlots();

/* ---------- リンク一覧 ---------- */
function linkSlots() {
  const d = D(), out = [];
  out.push({group:'Patreon', label:'Patreon ページのURL', obj:d.patreon, key:'url', icon:'patreon'});
  (d.patreon.tiers || []).forEach(t => out.push({group:'Patreon', label:`${t.name} の参加リンク`, obj:t, key:'url', icon:'crown', fallback:'Patreonページへ'}));
  ((d.patreon.oshi || {}).items || []).forEach(x => out.push({group:'Patreon', label:`${x.name} の参加リンク`, obj:x, key:'url', icon:'heart', fallback:'Patreonページへ'}));
  d.sns.forEach(x => out.push({group:'SNS・外部リンク', label:`${x.label}${x.handle ? '（' + x.handle + '）' : ''}`, obj:x, key:'url', icon:x.icon}));
  out.push({group:'連絡先ボタン', label:d.site.contactLabel || '連絡ボタン', obj:d.site, key:'contactUrl', icon:'mail'});
  d.hero.slides.forEach((s, i) => out.push({group:'トップ画像のボタン', label:`スライド${i + 1}「${s.linkLabel || '詳しく見る'}」`, obj:s, key:'link', icon:'star', internal:true}));
  d.news.forEach(n => out.push({group:'お知らせ', label:`${fmtDate(n.date)} ${n.text}`, obj:n, key:'link', icon:'bell', internal:true}));
  return out;
}
function linkState(v) {
  if (!v) return ['未設定', 'none'];
  if (/^https?:\/\/[^\s/]+\.[^\s]+$/i.test(v)) return ['外部リンク', 'ok'];
  if (/^mailto:[^\s@]+@[^\s@]+$/i.test(v)) return ['メール', 'ok'];
  const m = /^#\/([a-z]+)/.exec(v);
  if (m) return PAGE_IDS.includes(m[1]) ? ['サイト内', 'ok'] : ['ページなし', 'err'];
  return ['要確認', 'err'];
}
function linkRow(r) {
  const inp = h('input', {class:'ed-in', value:r.obj[r.key] || '', placeholder:r.fallback ? '空欄ならPatreonページ' : r.internal ? '#/gallery や https://' : 'https://', list:'rs-pages', spellcheck:'false'});
  const st = h('span', {class:'lk-st'});
  const check = () => { const v = inp.value.trim(); const [t, k] = !v && r.fallback ? [r.fallback, 'ok'] : linkState(v); st.textContent = t; st.className = 'lk-st ' + k; };
  inp.addEventListener('input', () => { r.obj[r.key] = inp.value.trim(); check(); changed(); });
  const open = h('button', {class:'ed-mini', type:'button', title:'開いて確認', html:icon('arrow'), onclick:() => {
    const v = inp.value.trim(); if (!v) return;

  }});

  return h('div', {class:'lk-row'},
    h('span', {class:'lk-ic', style:`--c:${BRAND[r.icon] || 'var(--accent)'}`, html:icon(r.icon || 'link')}),
    h('div', {class:'lk-main'}, h('b', {title:r.label}, r.label), inp), st, open);
}
function tabLinks() {
  const rows = linkSlots();

  for (const r of rows) { let g = groups.find(x => x.name === r.group); if (!g) groups.push(g = {name:r.group, items:[]}); g.items.push(r); }
  const bad = rows.filter(r => linkState(r.obj[r.key] || '')[1] === 'err').length;

    h('p', {class:'ed-hint'}, 'サイト内のページは #/home #/characters #/gallery #/patreon #/news #/links で指定できます（入力欄で候補が出ます）。')

}
