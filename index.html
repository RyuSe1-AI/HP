<style>
/* RyuSe1 STUDIO — layout: editorial journal / colors & type: icy blue × lavender */
:root{
  --bg:#f3f5fb;--surface:rgba(255,255,255,.76);--surface-solid:#ffffff;--surface-2:rgba(236,240,252,.95);
  --text:#252b47;--text-2:#4a5272;--muted:#8990ad;--line:rgba(135,150,205,.22);--line-strong:rgba(135,150,205,.4);
  --accent:#7482ea;--accent-2:#9a86ee;--accent-soft:rgba(116,130,234,.11);
  --holo:linear-gradient(118deg,#9ed7ff 0%,#bdb4ff 40%,#f2c3ea 70%,#b6ecdf 100%);
  --holo-soft:linear-gradient(118deg,rgba(158,215,255,.28),rgba(189,180,255,.28) 45%,rgba(242,195,234,.24) 75%,rgba(182,236,223,.22));
  --shadow:0 1px 2px rgba(40,50,100,.04),0 10px 30px rgba(70,82,150,.07);
  --shadow-hover:0 2px 4px rgba(40,50,100,.05),0 18px 40px rgba(70,82,150,.14);
  --shadow-lg:0 30px 80px rgba(30,36,80,.28);
  --glow-1:rgba(158,215,255,.42);--glow-2:rgba(189,180,255,.34);--glow-3:rgba(244,198,236,.22);
  --r-xl:26px;--r-lg:20px;--r-md:14px;--r-sm:10px;
  --ff-ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --ff-en:"Outfit",var(--ff-ja);color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1022;--surface:rgba(25,30,58,.72);--surface-solid:#181d38;--surface-2:rgba(33,39,72,.85);
  --text:#e9ecfb;--text-2:#c3c9e8;--muted:#8e96bd;--line:rgba(150,165,235,.14);--line-strong:rgba(150,165,235,.28);
  --accent:#9ba7ff;--accent-2:#b8a6ff;--accent-soft:rgba(155,167,255,.14);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.28);--shadow-hover:0 2px 4px rgba(0,0,0,.3),0 20px 44px rgba(0,0,0,.4);
  --glow-1:rgba(80,140,220,.20);--glow-2:rgba(130,110,230,.20);--glow-3:rgba(210,120,190,.10);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1022;--surface:rgba(25,30,58,.72);--surface-solid:#181d38;--surface-2:rgba(33,39,72,.85);
  --text:#e9ecfb;--text-2:#c3c9e8;--muted:#8e96bd;--line:rgba(150,165,235,.14);--line-strong:rgba(150,165,235,.28);
  --accent:#9ba7ff;--accent-2:#b8a6ff;--accent-soft:rgba(155,167,255,.14);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.28);--shadow-hover:0 2px 4px rgba(0,0,0,.3),0 20px 44px rgba(0,0,0,.4);
  --glow-1:rgba(80,140,220,.20);--glow-2:rgba(130,110,230,.20);--glow-3:rgba(210,120,190,.10);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:110px}
body{margin:0;min-height:100vh;color:var(--text);font:14px/1.8 var(--ff-ja);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:var(--bg);
  background-image:radial-gradient(900px 520px at 6% -8%,var(--glow-1),transparent 62%),radial-gradient(820px 620px at 104% 6%,var(--glow-2),transparent 60%),radial-gradient(760px 520px at 50% 112%,var(--glow-3),transparent 62%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff,transparent 60%),radial-gradient(1.2px 1.2px at 32% 72%,#fff,transparent 60%),radial-gradient(1.6px 1.6px at 58% 12%,#fff,transparent 60%),radial-gradient(1.2px 1.2px at 78% 44%,#fff,transparent 60%),radial-gradient(1.4px 1.4px at 90% 82%,#fff,transparent 60%),radial-gradient(1px 1px at 46% 90%,#fff,transparent 60%)}
#app{position:relative;z-index:1}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}h1,h2,h3,h4,p{margin:0}h1,h2,h3,h4{line-height:1.4}ul{margin:0;padding:0;list-style:none}
button,a,input,textarea{touch-action:manipulation}button,a{ -webkit-tap-highlight-color:transparent }
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
::selection{background:var(--accent-2);color:#fff}
.ic{width:20px;height:20px;flex:none}.en{font-family:var(--ff-en)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.skip-link{position:fixed;left:18px;top:10px;transform:translateY(-150%);z-index:120;background:var(--text);color:var(--bg);padding:10px 20px;border-radius:99px}.skip-link:focus{transform:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25)}

/* header */
.hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1360px;height:88px;margin:auto;padding:0 40px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:11px;flex:none}
.logo-mark{position:relative;overflow:hidden;width:38px;height:38px;display:grid;place-items:center;background:var(--holo);border-radius:12px;box-shadow:0 6px 18px rgba(150,160,240,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.logo-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.55),transparent 45%)}
.logo-mark svg{width:30px;height:30px;position:relative;z-index:1}
.logo-txt{font:600 23px/1 var(--ff-en);letter-spacing:-.02em}.logo-txt span{display:block;margin-top:7px;font-size:9px;font-weight:400;letter-spacing:.36em;color:var(--text-2)}
.gnav{display:flex;gap:26px;margin-left:auto}.gnav a{position:relative;padding:31px 0;font:400 13.5px/26px var(--ff-en);color:var(--text-2);transition:color .2s}
.gnav a:hover,.gnav a.on{color:var(--text)}.gnav a.on{font-weight:500}.gnav a.on::after{content:"";position:absolute;bottom:19px;left:0;right:0;height:3px;border-radius:3px;background:var(--holo)}
.nav-num{font:10px var(--ff-en);margin-right:5px;color:var(--muted)}.gnav a.on .nav-num{color:var(--accent)}
.hdr-tools{display:flex;gap:12px;align-items:center}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--text-2);transition:transform .2s,color .2s,box-shadow .2s}
.ibtn:hover{color:var(--text);transform:translateY(-1px);box-shadow:var(--shadow)}.ibtn .ic{width:18px;height:18px}.menu-btn{display:none}.theme-btn .i-sun{display:none}
:root[data-theme="dark"] .theme-btn .i-moon{display:none}:root[data-theme="dark"] .theme-btn .i-sun{display:block}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-btn .i-moon{display:none}:root:not([data-theme="light"]) .theme-btn .i-sun{display:block}}

/* layout */
.shell{max-width:1360px;margin:0 auto;padding:48px 40px 80px;min-height:65vh}.main{display:flex;flex-direction:column;gap:28px;min-width:0;container:main / inline-size}.main:focus{outline:0}.main[data-page="home"]{gap:84px}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1.17fr;gap:64px;align-items:center;position:relative;min-width:0}
.hero-copy{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:30px 0}
.studio-kicker,.eyebrow,.section-index{font:500 11px/1.6 var(--ff-en);letter-spacing:.17em;text-transform:uppercase}
.studio-kicker{display:flex;align-items:center;gap:10px;margin-bottom:26px;color:var(--text-2)}
.studio-kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--holo);box-shadow:0 0 0 3px var(--accent-soft)}
.hero-cap{width:100%;min-width:0}
.hero-cap h1{font-size:clamp(32px,4.1vw,58px);line-height:1.48;letter-spacing:-.02em;font-weight:700;white-space:pre-line;overflow-wrap:anywhere}
.hero-cap p{max-width:390px;color:var(--text-2);font-size:13.5px;line-height:2.1;margin-top:24px;white-space:pre-line}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:24px;margin-top:34px}
.hero-link,.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;padding:14px 24px;font-size:13px;font-weight:700;border:1px solid var(--text);background:var(--text);color:var(--bg);border-radius:99px;box-shadow:0 10px 24px rgba(37,43,71,.16);transition:background .2s,border-color .2s,transform .2s}
.hero-link .ic,.btn .ic{width:16px;height:16px}.hero-link:hover,.btn:hover{transform:translateY(-2px);background:var(--accent);border-color:var(--accent);color:#fff}
.text-link{display:inline-flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--line-strong);font-size:12.5px;font-weight:500;transition:color .2s,border-color .2s}.text-link:hover{color:var(--accent);border-color:var(--accent)}.text-link .ic{width:16px;height:16px}
.hero-signature{margin-top:48px;display:flex;align-items:center;gap:12px;color:var(--muted);font:11px/1.5 var(--ff-en);letter-spacing:.06em}.hero-signature::before{content:"";width:32px;height:2px;border-radius:2px;background:var(--holo)}
.hero-art{position:relative;min-width:0}
.art-mat{position:relative;aspect-ratio:1.15;overflow:hidden;background:radial-gradient(120% 90% at 15% 8%,rgba(158,215,255,.5),transparent 60%),radial-gradient(100% 80% at 92% 95%,rgba(242,195,234,.45),transparent 60%),linear-gradient(160deg,color-mix(in srgb,#dfe9ff 60%,var(--surface-solid)),color-mix(in srgb,#efe3ff 60%,var(--surface-solid)));border-radius:var(--r-xl);box-shadow:var(--shadow);isolation:isolate}
.slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity .8s ease;pointer-events:none}.slide.on{opacity:1}.slide img{width:100%;height:100%;object-fit:cover}
.art-label{position:absolute;top:18px;left:18px;z-index:2;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.8);color:#2a3050;font:600 10px var(--ff-en);letter-spacing:.14em;padding:7px 12px;border-radius:99px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.art-label .ic{width:12px;height:12px;color:var(--accent)}
.art-corner{position:absolute;bottom:18px;right:18px;z-index:2;font:500 10px var(--ff-en);letter-spacing:.12em;color:#2a3050;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.8);padding:5px 11px;border-radius:99px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.art-meta{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:16px}.art-meta>span{font:10px var(--ff-en);letter-spacing:.15em;color:var(--muted)}
.hero-controls{display:flex;align-items:center;gap:12px}.hero-bars{display:flex;align-items:center;gap:3px}.hero-bars button{position:relative;min-width:35px;height:36px;font:11px var(--ff-en);color:var(--muted)}
.hero-bars button::after{content:"";position:absolute;bottom:3px;left:8px;right:8px;height:2px;border-radius:2px;background:transparent}.hero-bars button.on{color:var(--text);font-weight:600}.hero-bars button.on::after{background:var(--holo)}
.hero-pause{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--surface)}.hero-pause:hover{color:var(--accent)}.hero-pause .ic{width:13px;height:13px}

/* studio strip */
.studio-strip{display:flex;align-items:center;gap:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin-top:-45px}
.strip-intro{flex:1;display:flex;align-items:center;gap:14px;min-width:0}
.strip-intro img{width:44px;height:44px;border-radius:50%;object-fit:cover;padding:2px;background:conic-gradient(from 200deg,#9ed7ff,#bdb4ff,#f2c3ea,#b6ecdf,#9ed7ff)}
.strip-intro b{display:block;font:600 13.5px var(--ff-en)}.strip-intro p{font-size:11.5px;color:var(--text-2);margin-top:4px}
.sns-row{display:flex;align-items:center;gap:8px}
.sns-row a{width:34px;height:34px;display:grid;place-items:center;color:var(--text-2);background:var(--surface);border:1px solid var(--line);border-radius:11px;transition:transform .2s,color .2s}
.sns-row a:hover{color:var(--accent);transform:translateY(-2px)}.sns-row .ic{width:16px;height:16px}
.muse-inline{display:flex;gap:12px;align-items:center;padding-left:22px;border-left:1px solid var(--line)}.muse-inline>div{display:flex;flex-direction:column}.muse-inline small{font:600 9px var(--ff-en);letter-spacing:.14em;color:var(--accent)}
.w-date,.w-time{font:10px/1.5 var(--ff-en);color:var(--text-2)}.w-time b{font-weight:400}
.w-muse{display:flex;align-items:center;gap:8px;text-align:left;padding:5px 10px 5px 5px;border-radius:14px;transition:background .2s}.w-muse:hover{background:var(--accent-soft)}
.w-muse img{width:36px;height:42px;object-fit:cover;border-radius:10px}.w-muse b{display:block;font-size:11.5px}.w-muse small{font-size:9px;letter-spacing:.08em}

/* section heads */
.section-head{display:flex;align-items:flex-end;gap:24px;justify-content:space-between;margin-bottom:30px}
.section-index{color:var(--accent);display:block;margin-bottom:10px}
.section-head h2{font:400 clamp(30px,3.2vw,44px)/1.1 var(--ff-en);letter-spacing:-.03em}
.section-head h2 span{display:inline-block;font:500 11.5px var(--ff-ja);letter-spacing:0;color:var(--text-2);margin-left:17px}

/* selected works */
.selected-grid{display:grid;grid-template-columns:1.16fr 1fr 1fr;gap:28px;align-items:start}.work-item{display:block;text-align:left;min-width:0}.work-item:nth-child(2){margin-top:48px}.work-item:nth-child(3){margin-top:94px}
.work-visual{display:block;position:relative;aspect-ratio:1;overflow:hidden;background:var(--holo-soft),var(--surface-2);border-radius:var(--r-lg);box-shadow:var(--shadow);transition:box-shadow .3s,transform .3s}
.work-item:hover .work-visual{box-shadow:var(--shadow-hover);transform:translateY(-3px)}
.work-item:first-child .work-visual{aspect-ratio:4/4.4}.work-visual img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.work-item:hover img{transform:scale(1.035)}
.work-open{position:absolute;bottom:14px;right:14px;width:36px;height:36px;display:grid;place-items:center;background:rgba(255,255,255,.88);color:var(--accent);border-radius:50%;box-shadow:0 6px 16px rgba(40,50,110,.14);transition:transform .2s}.work-item:hover .work-open{transform:scale(1.08)}.work-open .ic{width:16px;height:16px;transform:rotate(-45deg)}
.work-info{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.work-info b{font:500 16px var(--ff-en);overflow-wrap:anywhere}.work-info small{font:10px var(--ff-en);color:var(--muted)}.work-caption{font:500 10px var(--ff-en);letter-spacing:.12em;color:var(--accent);display:block;margin-top:5px}

/* explore directory */
.explore{display:grid;grid-template-columns:.75fr 1.5fr;gap:80px;border-top:1px solid var(--line);padding-top:44px}.explore .section-head{align-self:start}.explore-intro{max-width:230px;margin-top:18px;font-size:12.5px;color:var(--text-2);line-height:2}
.directory{min-width:0}.directory-row{display:flex;align-items:center;gap:22px;padding:23px 0;border-bottom:1px solid var(--line);position:relative;transition:color .2s}.directory-row:first-child{padding-top:0}.directory-row:hover{color:var(--accent)}
.directory-number{font:11px var(--ff-en);color:var(--muted);align-self:flex-start;margin-top:8px}
.directory-thumb{width:72px;height:78px;flex:none;overflow:hidden;background:var(--holo-soft),var(--surface-2);border-radius:var(--r-md);box-shadow:var(--shadow)}.directory-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.directory-row:hover img{transform:scale(1.07)}.directory-thumb.restricted img{filter:blur(5px);transform:scale(1.15)}
.directory-name{min-width:0;flex:1}.directory-name b{display:block;font:400 24px/1.25 var(--ff-en);letter-spacing:-.02em;overflow-wrap:anywhere}.directory-name small{font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;margin-top:7px}.directory-name small .ic{width:13px;height:13px;color:var(--accent)}.directory-count{font:10px var(--ff-en);color:var(--muted)}
.directory-row>.ic{width:34px;height:34px;padding:9px;border-radius:50%;background:var(--accent-soft);color:var(--accent);transform:rotate(-45deg);transition:transform .25s}.directory-row:hover>.ic{transform:rotate(0)}

/* journal */
.journal{display:grid;grid-template-columns:.75fr 1.5fr;gap:80px;padding-top:44px;border-top:1px solid var(--line)}.journal .section-head{align-self:start;align-items:flex-start;flex-direction:column}.journal .text-link{margin-top:20px}
.tl li{display:grid;grid-template-columns:88px 96px 1fr;align-items:center;gap:16px;padding:21px 0;border-bottom:1px solid var(--line)}.tl li:first-child{padding-top:0}.tl time{font:11.5px var(--ff-en);color:var(--text-2)}.tl .txt{font-size:13px;min-width:0;overflow-wrap:anywhere}.tl .txt a:hover{color:var(--accent)}
.cat{justify-self:start;display:inline-flex;justify-content:center;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:8px;white-space:nowrap;color:var(--cc,var(--text-2));background:color-mix(in srgb,var(--cc,var(--accent)) 13%,transparent)}
.connect-strip{padding:22px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:24px}.connect-strip>span{font:500 11px var(--ff-en);letter-spacing:.14em;color:var(--muted);margin-right:auto}.connect-strip a{display:flex;align-items:center;gap:7px;font:500 13px var(--ff-en);transition:color .2s}.connect-strip a:hover{color:var(--accent)}.connect-strip .ic{width:14px;height:14px}

/* footer */
.foot{position:relative;z-index:1;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 60%,transparent)}.foot-in{max-width:1360px;margin:auto;padding:30px 40px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}.foot .logo-mark{width:28px;height:28px;border-radius:9px}.foot .logo-mark svg{width:23px;height:23px}.foot .logo-txt{font-size:18px}.foot .logo-txt span{font-size:7px}
.foot small{font:10.5px var(--ff-en);color:var(--muted)}.foot nav{display:flex;gap:17px;margin-left:auto;flex-wrap:wrap}.foot nav a{font-size:11px;color:var(--text-2)}.foot nav a:hover{color:var(--accent)}.foot .notice{width:100%;font-size:10.5px;color:var(--muted);border-top:1px dashed var(--line-strong);padding-top:20px}

/* sub pages */
.page-head{position:relative;padding:30px 0 34px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--accent)}.eyebrow .ic{width:14px;height:14px}
.page-head h1{font-size:40px;letter-spacing:-.01em;font-weight:700;margin:13px 0 14px}.page-head p{color:var(--text-2);font-size:13.5px;max-width:680px}

/* 保存データに足りない項目を初期値で補う */
function mergeData(d) {
  const base = JSON.parse(JSON.stringify(DEFAULT));
  if (!d || typeof d !== 'object') return base;
  d = JSON.parse(JSON.stringify(d));
  for (const k of Object.keys(base)) if (!(k in d)) d[k] = base[k];
  for (const k of ['site','hero','tiles','pages','patreon']) d[k] = Object.assign({}, base[k], d[k] || {});
  for (const k of Object.keys(base.tiles)) d.tiles[k] = Object.assign({}, base.tiles[k], d.tiles[k] || {});
  for (const k of Object.keys(base.pages)) d.pages[k] = Object.assign({}, base.pages[k], d.pages[k] || {});
  const pt = d.patreon;
  if (Array.isArray(pt.tiers) && pt.tiers.map(t => t && t.name).join() === 'Star,Comet,Galaxy') {   // 仮プランのままなら実プランに置き換え
    pt.tiers = base.patreon.tiers;
    if (/^高解像度イラストや差分/.test(pt.lead || '')) pt.lead = base.patreon.lead;
    if (/^※ 限定コンテンツの本編は/.test(pt.note || '')) pt.note = base.patreon.note;
    (pt.previews || []).forEach(x => { if (x.tier === 'Star') x.tier = 'basic'; if (x.tier === 'Comet') x.tier = 'Extra'; });
  }
  if (!pt.oshi || typeof pt.oshi !== 'object') pt.oshi = base.patreon.oshi;
  if (!Array.isArray(pt.oshi.items)) pt.oshi.items = [];
  return d;
}

  </div>
  ${footerHTML()}
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="メニュー"><div class="drawer-back" data-act="drawer-close"></div><div class="drawer-panel"><button class="ibtn drawer-close" data-act="drawer-close" aria-label="メニューを閉じる">${icon('close')}</button>${sidebarHTML()}</div></div>`;
  $$('[data-nav]').forEach(a => { const on=a.dataset.nav===page; a.classList.toggle('on',on); if(on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const s = D().site, nv = navItem(page);
  document.title = page === 'home' ? `${s.name} ${s.suffix}`.trim() : `${nv.label} | ${s.name} ${s.suffix}`.trim();
  if (page === 'home') startHero(); else stopHero();
  startClock();
}
function renderMain() {
  const main = $('#main');
  if (!main) return render();
  main.innerHTML = PAGES[S.route.page]();
  if (S.route.page === 'home') startHero();
  startClock();
}

/* hero slider */
function showSlide(i) {
  const slides=D().hero.slides;
  S.slide=slides.length ? ((i % slides.length)+slides.length)%slides.length : 0;
  $$('.slide').forEach(el=>{ const on=+el.dataset.i===S.slide; el.classList.toggle('on',on); el.setAttribute('aria-hidden',String(!on)); });
  $$('.hero-bars button').forEach((b,k)=>{b.classList.toggle('on',k===S.slide);b.setAttribute('aria-pressed',String(k===S.slide));});
  const s=slides[S.slide], cap=$('#heroCap'), badge=$('#heroBadge'), idx=$('#heroIndex');
  if(cap) cap.innerHTML=heroCapHTML(s);
  if(badge){badge.textContent=s&&s.badge?s.badge:'FEATURED';}
  if(idx) idx.textContent=String(S.slide+1).padStart(2,'0');
  updateHeroPause();
}
function updateHeroPause() {
  const b=$('[data-act="hero-pause"]');
  if(!b) return;
  b.setAttribute('aria-pressed',String(S.heroPaused));
  b.setAttribute('aria-label',S.heroPaused?'スライドの自動再生を開始':'スライドの自動再生を停止');
  b.innerHTML=icon(S.heroPaused?'play':'pause');
}
function startHero() {
  stopHero();
  if(S.slide>=D().hero.slides.length) S.slide=0;
  showSlide(S.slide);
  startHeroTimerOnly();
}
function stopHero() { clearInterval(S.heroTimer); S.heroTimer = null; }

/* clock */
function tick() {
  const t = $('#wTime'), d = $('#wDate');
  if (!t) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0'), mm = String(now.getMinutes()).padStart(2, '0');
  t.innerHTML = `${hh}<b>:</b>${mm}`;
  const M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][now.getMonth()];
  const W = ['SUN','MON','TUE','WED','THU','FRI','SAT'][now.getDay()];
  d.textContent = `${M} ${now.getDate()}, ${now.getFullYear()} · ${W}`;
}
function startClock() { clearInterval(S.clockTimer); tick(); S.clockTimer = setInterval(tick, 10000); }

/* =========================================================
   modal: character
   ========================================================= */
function closeModal() {
  $('#modal-root').innerHTML = '';
  document.body.style.overflow = '';
  S.lb = null;
}
function openChar(id) {
  const cs = D().characters;
  const i = cs.findIndex(c => c.id === id);
  if (i < 0) return;
  const c = cs[i], prev = cs[(i - 1 + cs.length) % cs.length], next = cs[(i + 1) % cs.length];
  const works = sortedGallery().filter(g => (g.chars || []).includes(c.id)).slice(0, 4);
  const tags = String(c.tags || '').split(/[,、，]/).map(x => x.trim()).filter(Boolean);
  $('#modal-root').innerHTML = `<div class="modal-back" data-backdrop>
    <div class="modal char-modal" role="dialog" aria-modal="true" aria-label="${esc(c.name)}" style="--c:${esc(c.color)}">
      <button class="m-close" data-act="modal-close" aria-label="閉じる">${icon('close')}</button>
      <div class="cm-img"><img src="${esc(charImg(c))}" alt="${esc(c.name)}" style="object-position:50% ${+c.pos || 25}%"></div>
      <div class="cm-body">
        <span class="eyebrow">No.${String(i+1).padStart(2,'0')} · ${esc(c.romaji)}</span>
        <h2>${esc(c.name)}<i></i></h2>
        ${c.catch ? `<p class="cm-catch">${esc(c.catch)}</p>` : ''}
        ${c.desc ? `<p class="cm-desc">${esc(c.desc)}</p>` : ''}
        ${(c.profile || []).length ? `<dl class="cm-prof">${c.profile.map(p => `<dt>${esc(p.k)}</dt><dd>${esc(p.v)}</dd>`).join('')}</dl>` : ''}
        ${tags.length ? `<div class="tags">${tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div>` : ''}
        ${works.length ? `<div><div class="cm-sub">ARTWORKS</div><div class="cm-gal" style="margin-top:8px">${works.map(g => `<button data-gal="${esc(g.id)}" data-galscope="${esc(c.id)}"><img src="${esc(galImg(g))}" alt="${esc(g.title)}"></button>`).join('')}</div></div>` : ''}
        <div class="cm-nav">
          <button data-char="${esc(prev.id)}" style="--c:${esc(prev.color)}">${icon('chevL')}${esc(prev.name)}</button>
          <button data-char="${esc(next.id)}" style="--c:${esc(next.color)}">${esc(next.name)}${icon('chev')}</button>
        </div>
      </div>
    </div></div>`;
  document.body.style.overflow = 'hidden';
  $('.m-close').focus({preventScroll:true});
}

/* =========================================================
   lightbox
   ========================================================= */
function openLightbox(id, scope) {
  let list = scope ? sortedGallery().filter(g => (g.chars || []).includes(scope))
                   : (S.route.page === 'gallery' ? galleryFiltered() : sortedGallery());
  let i = list.findIndex(g => g.id === id);
  if (i < 0) { list = sortedGallery(); i = list.findIndex(g => g.id === id); }
  if (i < 0) return;
  S.lb = {list, i};
  drawLightbox();
  document.body.style.overflow = 'hidden';
}
function drawLightbox() {
  const {list, i} = S.lb;
  const g = list[i];
  $('#modal-root').innerHTML = `<div class="lightbox" role="dialog" aria-modal="true" aria-label="${esc(g.title)}">
    <button class="lb-x" data-act="modal-close" aria-label="閉じる">${icon('close')}</button>
    <div class="lb-stage" data-backdrop><img src="${esc(galImg(g))}" alt="${esc(g.title)}"></div>
    ${list.length > 1 ? `<button class="lb-btn lb-prev" data-act="lb-prev" aria-label="前へ">${icon('chevL')}</button><button class="lb-btn lb-next" data-act="lb-next" aria-label="次へ">${icon('chev')}</button>` : ''}
    <div class="lb-bar"><div><b>${esc(g.title)}</b><br><small>${esc(fmtDate(g.date))}</small></div>
      <div class="lb-chips">${(g.chars || []).map(id => { const c = charById(id); return c ? `<span style="--c:${esc(c.color)}">${esc(c.name)}</span>` : ''; }).join('')}</div>
      <span class="cnt">${i+1} / ${list.length}</span></div>
  </div>`;
}
function lbStep(d) { if (!S.lb) return; S.lb.i = (S.lb.i + d + S.lb.list.length) % S.lb.list.length; drawLightbox(); }

/* =========================================================
   routing & events
   ========================================================= */
function parseRoute(r) {
  const h = (r || location.hash || '').replace(/^#\/?/, '');
  const [page, id] = h.split('/');
  return {page: PAGES[page] ? page : 'home', id: decodeURIComponent(id || '')};
}
function onRoute() {
  const r = parseRoute();
  const samePage = r.page === S.route.page && $('#main');
  S.route = r;
  closeDrawer();
  if (!samePage) { closeModal(); render(); const html = document.documentElement; html.style.scrollBehavior = 'auto'; window.scrollTo(0, 0); html.style.scrollBehavior = ''; }
  if (r.page === 'characters' && r.id) openChar(r.id);
}
function toggleTheme() {
  const root = document.documentElement;
  const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  root.dataset.theme = cur === 'dark' ? 'light' : 'dark';
}
function openDrawer() {
  const d=$('#drawer'); if(!d) return;
  stopHero();d.classList.add('open');document.body.style.overflow='hidden';
  $('.menu-btn')?.setAttribute('aria-expanded','true');
  $('#main').inert=true;$('.hdr').inert=true;$('.foot').inert=true;
  $('.drawer-close',d)?.focus();
}
function closeDrawer() {
  const d=$('#drawer');if(!d||!d.classList.contains('open')) return;
  d.classList.remove('open');document.body.style.overflow='';
  $('#main').inert=false;$('.hdr').inert=false;$('.foot').inert=false;
  $('.menu-btn')?.setAttribute('aria-expanded','false');$('.menu-btn')?.focus();
  if(S.route.page==='home') startHeroTimerOnly();
}
document.addEventListener('keydown', e=>{
  if(e.key!=='Tab' || !$('#drawer.open')) return;
  const items=$$('button,a[href]', $('#drawer')), first=items[0], last=items[items.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#editor-root')) return;
  const bd = t.closest('[data-backdrop]');
  if (bd && t === bd) { closeModal(); return; }
  const a = t.closest('[data-act],[data-char],[data-gal],[data-filter],[data-newsfilter],[data-slide]');
  if (!a) {
    if (t.closest('.drawer a')) closeDrawer();
    return;
  }
  if (a.dataset.act) {
    const act = a.dataset.act;
    if (act === 'theme') toggleTheme();
    else if (act === 'menu') openDrawer();
    else if (act === 'skip') { e.preventDefault(); $('#main')?.focus(); $('#main')?.scrollIntoView(); }
    else if (act === 'hero-pause') { S.heroPaused=!S.heroPaused; updateHeroPause(); startHeroTimerOnly(); }
    else if (act === 'drawer-close') closeDrawer();
    else if (act === 'modal-close') closeModal();
    else if (act === 'lb-prev') lbStep(-1);
    else if (act === 'lb-next') lbStep(1);
    return;
  }
  if (a.dataset.char) { closeModal(); openChar(a.dataset.char); return; }
  if (a.dataset.gal) { const sc = a.dataset.galscope; closeModal(); openLightbox(a.dataset.gal, sc); return; }
  if (a.dataset.filter) { S.galFilter = a.dataset.filter; renderMain(); return; }
  if (a.dataset.newsfilter) { S.newsFilter = a.dataset.newsfilter; renderMain(); return; }
  if (a.hasAttribute('data-slide')) { showSlide(+a.dataset.slide); stopHero(); return; }
});
function startHeroTimerOnly() {
  stopHero();
  if(S.route.page==='home' && D().hero.slides.length>1 && !S.heroPaused && !document.hidden && !$('#drawer.open') && !$('#modal-root')?.innerHTML && !matchMedia('(prefers-reduced-motion: reduce)').matches)
    S.heroTimer=setInterval(()=>showSlide(S.slide+1),Math.max(2,+D().hero.interval||6)*1000);
}
// Stop automatic changes while someone reads or uses the featured links.
document.addEventListener('pointerover',e=>{if(e.target.closest('.hero')) stopHero();});
document.addEventListener('pointerout',e=>{if(e.target.closest('.hero') && !e.relatedTarget?.closest?.('.hero') && !document.activeElement?.closest?.('.hero')) startHeroTimerOnly();});
document.addEventListener('focusin',e=>{if(e.target.closest('.hero')) stopHero();});
document.addEventListener('focusout',e=>{if(e.target.closest('.hero') && !e.relatedTarget?.closest?.('.hero')) startHeroTimerOnly();});
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('#editor-root')) return;
  if (e.key === 'Escape') { if ($('#modal-root').innerHTML) closeModal(); else closeDrawer(); }
  if (S.lb && e.key === 'ArrowLeft') lbStep(-1);
  if (S.lb && e.key === 'ArrowRight') lbStep(1);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopHero(); else if (S.route.page === 'home' && $('.hero')) startHeroTimerOnly();
});
window.addEventListener('hashchange', onRoute);

/* =========================================================
   boot
   ========================================================= */
/* 設定は data.json から読む（index.html を差し替えても設定が消えないように） */
const hasEmbedded = (() => { try { return !!JSON.parse($('#site-data').textContent || 'null'); } catch (e) { return false; } })();
async function fetchLatestData() {
  if (window.RS_PREVIEW || !/^https?:$/.test(location.protocol)) return null;
  try {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 5000);
    const r = await fetch('data.json?t=' + Date.now(), {cache:'no-store', signal:ctl.signal});
    clearTimeout(tm);
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}
function firstRender() {
  S.route = parseRoute(window.RS_PREVIEW ? window.RS_ROUTE : '');
  render();
  if (S.route.page === 'characters' && S.route.id) openChar(S.route.id);
}
if (hasEmbedded || window.RS_PREVIEW) {
  firstRender();
  fetchLatestData().then(d => {
    if (!d || !d.publishedAt || d.publishedAt === S.data.publishedAt) return;
    S.data = mergeData(d);
    const y = window.scrollY; render(); window.scrollTo(0, y);
  });
} else {
  fetchLatestData().then(d => { if (d) S.data = mergeData(d); firstRender(); });
}

/* 管理ページ（admin.html）のプレビューとして表示されている時だけ動く */
if (window.RS_PREVIEW) {
  const goRoute = r => {
    S.route = parseRoute(r);
    closeDrawer(); closeModal(); render(); window.scrollTo(0, 0);
    if (S.route.page === 'characters' && S.route.id) openChar(S.route.id);
  };
  // プレビュー内のページ移動はURLを変えずに切り替える
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/"]');
    if (a) { e.preventDefault(); goRoute(a.getAttribute('href')); }
  }, true);
  window.addEventListener('message', e => {
    if (e.source !== window.parent) return;
    const m = e.data || {};
    if (m.type === 'rs-assets') {
      for (const [k, v] of Object.entries(m.assets || {})) if (typeof v === 'string' && v.startsWith('data:image/')) ASSETS.set(k, v);
    } else if (m.type === 'rs-preview') {
      S.data = mergeData(m.data);
      const y = window.scrollY, root = document.documentElement;
      root.style.scrollBehavior = 'auto'; render(); window.scrollTo(0, y); root.style.scrollBehavior = '';
    } else if (m.type === 'rs-route' && typeof m.route === 'string') {
      goRoute(m.route);
    }
  });
  window.parent.postMessage({type:'rs-ready'}, '*');
}
})();
</script>
</body>
</html>
